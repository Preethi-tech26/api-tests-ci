name: Postman API Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Newman and HTML Extra reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman collection
        id: newman
        continue-on-error: true
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          mkdir -p newman
          mkdir -p reports
          set -o pipefail
          newman run tests/collection.json \
            -e tests/env.json \
            --env-var api_key=$NASA_API_KEY \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/index.html \
            | tee newman/newman-log.txt

      - name: Upload Newman artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: |
            reports/index.html
            newman/newman-log.txt

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports

      - name: Fail pipeline if Newman failed
        if: steps.newman.outcome == 'failure'
        run: exit 1
